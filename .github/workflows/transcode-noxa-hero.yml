name: Transcode NOXA Hero

on:
  push:
    paths:
      - ".github/workflows/transcode-noxa-hero.yml"

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/website-v2-p2-cinematic-20260903

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download selected Pexels clip
        run: |
          curl --fail --location --retry 3 \
            "https://videos.pexels.com/video-files/35716927/15137301_2160_3840_29fps.mp4" \
            --output /tmp/noxa-hero-source.mp4

      - name: Create Safari-compatible mobile hero
        run: |
          mkdir -p public/media
          ffmpeg -y \
            -i /tmp/noxa-hero-source.mp4 \
            -t 9 \
            -vf "scale=720:1280:flags=lanczos" \
            -an \
            -c:v libx264 \
            -profile:v high \
            -level:v 4.0 \
            -pix_fmt yuv420p \
            -preset medium \
            -crf 24 \
            -movflags +faststart \
            public/media/noxa-hero-720p.mp4

          ffprobe -v error \
            -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json \
            public/media/noxa-hero-720p.mp4

      - name: Commit optimized hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/noxa-hero-720p.mp4
          git commit -m "feat(hero): add Safari-compatible cinematic clip"
          git push origin HEAD:feature/website-v2-p2-cinematic-20260903
